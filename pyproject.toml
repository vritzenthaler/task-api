[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "task-api"
version = "0.1.0"
description = "Une petite API de gestion de tâches"
requires-python = ">=3.10"
dependencies = [
    "bcrypt",
    "fastapi",
    "PyJWT[crypto]",
    "python-dotenv",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "httpx2",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
